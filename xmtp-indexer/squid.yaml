manifestVersion: subsquid.io/v0.1
name: xmtp-indexer
version: 5
description: "XMTP Agent Payment Indexer for Base mainnet"
build:
scale:
  dedicated: false
deploy:
  addons:
    postgres:
  processor:
    cmd:
      - sqd
      - process:prod
    env:
      AGENT_ADDRESS: "0xa14ce36e7b135b66c3e3cb2584e777f32b15f5dc"
      DEPLOYMENT_BLOCK: "34200000"
  api:
    cmd:
      - sqd
      - serve:prod
